<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>휴양림 빈자리 달력</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2;
    --surface-1: #fcfcfb;
    --surface-2: #eeeeea;
    --border: #dddad2;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a887f;
    --accent: #008300;          /* 예약 가능 = good */
    --accent-ink: #006400;
    --tint-1: rgba(0,131,0,.10);  /* 1~2곳 */
    --tint-2: rgba(0,131,0,.20);  /* 3~9곳 */
    --tint-3: rgba(0,131,0,.32);  /* 10곳+ */
    --sun: #c03434;
    --sat: #2a78d6;
    --warn-bg: #fdf3e0;
    --warn-ink: #8a5a00;
    --shadow: 0 8px 28px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --surface-2: #242422;
      --border: #3a3a36;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #83817a;
      --accent: #35a835;
      --accent-ink: #6fce6f;
      --tint-1: rgba(53,168,53,.14);
      --tint-2: rgba(53,168,53,.26);
      --tint-3: rgba(53,168,53,.40);
      --sun: #e66767;
      --sat: #3987e5;
      --warn-bg: #35290f;
      --warn-ink: #e5b96a;
      --shadow: 0 8px 28px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #242422;
    --border: #3a3a36;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #83817a;
    --accent: #35a835;
    --accent-ink: #6fce6f;
    --tint-1: rgba(53,168,53,.14);
    --tint-2: rgba(53,168,53,.26);
    --tint-3: rgba(53,168,53,.40);
    --sun: #e66767;
    --sat: #3987e5;
    --warn-bg: #35290f;
    --warn-ink: #e5b96a;
    --shadow: 0 8px 28px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.5;
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }

  header h1 { font-size: 1.35rem; font-weight: 700; }
  header .sub { color: var(--text-secondary); font-size: .85rem; margin-top: 2px; }

  .banner {
    margin-top: 12px; padding: 8px 12px; border-radius: 8px;
    background: var(--warn-bg); color: var(--warn-ink); font-size: .85rem;
  }

  .tiles { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
  .tile {
    flex: 1 1 120px; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px;
  }
  .tile .k { font-size: .75rem; color: var(--text-secondary); }
  .tile .v { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: .8rem; font-weight: 400; color: var(--text-muted); }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .controls input, .controls select {
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-primary); font-size: .9rem;
  }
  .controls input { flex: 1 1 180px; }
  .controls select { flex: 0 0 auto; cursor: pointer; }
  .controls input:focus, .controls select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-secondary);
    font-size: .9rem; cursor: pointer;
  }
  .tabs button.on {
    background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 700;
  }

  .cal { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .dow, .week { display: grid; grid-template-columns: repeat(7, 1fr); }
  .dow div {
    padding: 8px 0; text-align: center; font-size: .78rem;
    color: var(--text-secondary); background: var(--surface-2);
  }
  .dow div:first-child { color: var(--sun); }
  .dow div:last-child { color: var(--sat); }
  .day {
    min-height: 86px; padding: 6px; border-top: 1px solid var(--border);
    border-left: 1px solid var(--border); position: relative;
    display: flex; flex-direction: column; gap: 3px;
  }
  .week .day:first-child { border-left: none; }
  .day.blank { background: var(--surface-2); opacity: .45; }
  .day.past .num, .day.past .mini { opacity: .38; }
  .day .num { font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .day.sun .num { color: var(--sun); }
  .day.sat .num { color: var(--sat); }
  .day.today .num::after {
    content: "오늘"; margin-left: 4px; font-size: .62rem; font-weight: 700;
    color: var(--accent-ink);
  }
  .day.has { cursor: pointer; }
  .day.t1 { background: var(--tint-1); }
  .day.t2 { background: var(--tint-2); }
  .day.t3 { background: var(--tint-3); }
  .day.has:hover { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
  .badge {
    align-self: flex-start; font-size: .72rem; font-weight: 700;
    color: #fff; background: var(--accent); border-radius: 999px; padding: 1px 8px;
  }
  .mini { font-size: .68rem; color: var(--text-secondary); overflow: hidden; }
  .mini div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .more { color: var(--text-muted); }

  dialog {
    border: 1px solid var(--border); border-radius: 14px; padding: 0;
    background: var(--surface-1); color: var(--text-primary);
    width: min(560px, calc(100vw - 32px)); max-height: 80vh; box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface-1);
  }
  .dlg-head h2 { font-size: 1rem; }
  .dlg-head button {
    border: none; background: none; font-size: 1.2rem; cursor: pointer;
    color: var(--text-secondary); padding: 4px 8px;
  }
  .dlg-body { padding: 10px 18px 18px; overflow-y: auto; }
  .forest { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .forest:last-child { border-bottom: none; }
  .forest h3 { font-size: .92rem; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .forest h3 .region { font-size: .75rem; font-weight: 400; color: var(--text-muted); }
  .forest h3 .fname {
    color: var(--text-primary); text-decoration: none;
    border-bottom: 1px solid var(--border);
  }
  .forest h3 .fname:hover { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .forest h3 .fname::after { content: " ↗"; font-size: .7rem; color: var(--text-muted); }
  .forest h3 .maps { margin-left: auto; display: flex; gap: 6px; }
  .maps a {
    font-size: .7rem; font-weight: 400; text-decoration: none;
    color: var(--text-secondary); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }
  .maps a:hover { border-color: var(--accent); color: var(--accent-ink); }
  .room { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; padding: 3px 0; }
  .room .rn { color: var(--text-secondary); }
  .room .rm { color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .room .rp { color: var(--text-primary); font-weight: 600; }
  .room .rp.unknown { color: var(--text-muted); font-weight: 400; }
  .forest .rule { font-size: .74rem; color: var(--warn-ink); margin: 2px 0 4px; }

  .day .open {
    font-size: .64rem; font-weight: 600; color: var(--warn-ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .open-section {
    background: var(--warn-bg); border-radius: 10px;
    padding: 10px 14px; margin: 12px 0 4px;
  }
  .open-section h4 { font-size: .82rem; color: var(--warn-ink); margin-bottom: 4px; }
  .open-row {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: .78rem; color: var(--text-secondary); padding: 2px 0;
  }
  .open-row span:last-child { color: var(--text-muted); white-space: nowrap; }

  footer { margin-top: 18px; font-size: .75rem; color: var(--text-muted); }
  footer a { color: inherit; }
  .empty-note { padding: 30px; text-align: center; color: var(--text-muted); font-size: .9rem; }

  @media (max-width: 560px) {
    .day { min-height: 64px; }
    .mini { display: none; }
    .badge { font-size: .66rem; padding: 1px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌲 휴양림 빈자리 달력</h1>
    <div class="sub" id="meta">데이터 불러오는 중…</div>
  </header>

  <div id="banners"></div>

  <div class="tiles" id="tiles"></div>

  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <select id="region" aria-label="지역 필터">
      <option value="">전체 지역</option>
    </select>
    <select id="price" aria-label="가격 필터">
      <option value="0">전체 가격</option>
      <option value="50000">5만원 이하</option>
      <option value="100000">10만원 이하</option>
      <option value="150000">15만원 이하</option>
      <option value="200000">20만원 이하</option>
    </select>
    <input id="filter" type="search" placeholder="휴양림명 필터" autocomplete="off">
  </div>

  <div class="cal">
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div id="grid"></div>
  </div>

  <footer>
    출처: <a href="https://www.foresttrip.go.kr" target="_blank" rel="noopener">숲나들e</a>
    · 숙박 시설 기준 · 매일 아침 자동 갱신 · 가격은 1박 기준(성수기·주말 반영, 기준인원 초과 요금 별도)이며
    "가격 미확인" 객실은 다음 갱신에서 순차 채워집니다 · 실제 예약 가능 여부는 숲나들e에서 최종 확인하세요.
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <h2 id="dlg-title"></h2>
    <button id="dlg-close" aria-label="닫기">✕</button>
  </div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>

<script>
(function () {
  "use strict";
  var DATA = null;
  // vacancy.json 은 중복을 걷어낸 인덱스 참조형(schema v2)이다. 마스터 배열을
  // 그대로 들고, 날짜별 데이터는 필요한 순간에만 풀어 쓴다(5만 건을 미리
  // 객체로 펼치면 메모리만 낭비된다).
  var FORESTS = [];      // [이름, 지점ID, 지역]
  var ROOMS = [];        // [이름, 유형idx, 정원, 면적]
  var CATEGORIES = [];
  var months = [];       // ["202608","202609"]
  var current = 0;       // months 인덱스
  var filterText = "";
  var regionFilter = "";
  var maxPrice = 0;      // 0 = 전체 가격

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var norm = function (s) { return String(s).replace(/\s+/g, ""); };

  function todayKey() {
    var now = new Date();
    return "" + now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, "0") +
      String(now.getDate()).padStart(2, "0");
  }

  // 필터(지역 + 가격 + 휴양림명) 적용된 해당 날짜의 지점 목록.
  // 반환 원소는 {name, id, region, slots} — slots 는 [객실idx, 요금] 쌍 그대로다.
  // 객실 상세는 팝업을 열 때만 풀어내므로 달력 렌더링은 마스터 조회 몇 번으로 끝난다.
  // 가격 필터는 예산 안의 객실만 남기고, 남는 객실이 없는 지점은 제외한다
  // (요금 0 = 미확인은 예산 판정이 불가능하므로 함께 제외된다).
  function entriesFor(dateKey) {
    var list = (DATA.days && DATA.days[dateKey]) || [];
    var needle = filterText ? norm(filterText) : null;
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var f = FORESTS[list[i][0]];
      if (!f) continue;
      if (regionFilter && f[2] !== regionFilter) continue;
      if (needle && norm(f[0]).indexOf(needle) === -1) continue;
      var slots = list[i][1];
      if (maxPrice > 0) {
        slots = slots.filter(function (s) { return s[1] > 0 && s[1] <= maxPrice; });
        if (!slots.length) continue;
      }
      out.push({ name: f[0], id: f[1], region: f[2], slots: slots });
    }
    return out;
  }

  // 팝업에 뿌릴 객실 목록으로 풀어낸다 (요금 0 = 미확인 → null)
  function hydrateRooms(slots) {
    return slots.map(function (s) {
      var r = ROOMS[s[0]] || ["", 0, 0, 0];
      return {
        name: r[0],
        category: CATEGORIES[r[1]] || "",
        capacity: r[2] || null,
        area: r[3] || null,
        price: s[1] > 0 ? s[1] : null
      };
    });
  }

  // 정책 표와 조회 데이터의 지점명 표기가 다르다:
  //   조회   "[공립](광양시)백운산자연휴양림"
  //   정책   "광양백운산자연휴양림" (시 이름이 이름에 붙어 있음)
  // 이름만으로 맞추면 국립 백운산(원주시) 규칙이 엉뚱하게 붙으므로
  // 운영주체 + 시·군·구까지 일치해야 인정하고, 애매하면 규칙을 표시하지 않는다.
  var byTypeGu = {};      // "주체|시군구" -> [policy]
  var byTypeName = {};    // "주체|이름" -> [policy]
  var openByDay = {};     // 매월 고정 오픈일(1~31) -> [policy, ...]

  function buildPolicyIndex() {
    (DATA.policies || []).forEach(function (p) {
      var gu = p.type + "|" + p.sigungu;
      (byTypeGu[gu] = byTypeGu[gu] || []).push(p);
      var nm = p.type + "|" + norm(p.name);
      (byTypeName[nm] = byTypeName[nm] || []).push(p);
      if (p.open_day) (openByDay[p.open_day] = openByDay[p.open_day] || []).push(p);
    });
  }

  // 두 소스의 이름 표기가 제각각이라 단계적으로 좁힌다. 확정할 수 없으면
  // null 을 돌려 규칙을 감춘다 — 틀린 오픈일을 보여주는 쪽이 더 나쁘다.
  function policyFor(forestName) {
    var type = (forestName.match(/^\s*\[([^\]]*)\]/) || [])[1] || "";
    var gu = sigungu(forestName);
    var bare = norm(bareName(forestName));
    if (!type) return null;

    var group = byTypeGu[type + "|" + gu] || [];
    var exact = group.filter(function (p) { return norm(p.name) === bare; });
    if (exact.length === 1) return exact[0];
    // "광양백운산자연휴양림" ⊃ "백운산자연휴양림" 처럼 시 이름이 붙은 표기
    var partial = group.filter(function (p) {
      var n = norm(p.name);
      return n.indexOf(bare) !== -1 || bare.indexOf(n) !== -1;
    });
    if (partial.length === 1) return partial[0];
    if (group.length === 1) return group[0];
    // 시·군·구 표기가 어긋나는 경우("대구시" vs "달성군") — 이름이 전국에서
    // 유일할 때만 인정한다
    var byName = byTypeName[type + "|" + bare] || [];
    if (byName.length === 1) return byName[0];
    return null;
  }

  // 해당 날짜에 예약이 오픈되는 휴양림 목록 (휴양림명 필터만 적용)
  function opensFor(dayOfMonth) {
    var list = openByDay[dayOfMonth] || [];
    if (!filterText) return list;
    var needle = norm(filterText);
    return list.filter(function (p) { return p.name.indexOf(needle) !== -1; });
  }

  function populateRegions() {
    // 지점 마스터에는 빈자리가 있는 지점만 담겨 있어 그대로 지역 목록이 된다
    var seen = {};
    FORESTS.forEach(function (f) { if (f[2]) seen[f[2]] = 1; });
    var opts = Object.keys(seen).sort(function (a, b) { return a.localeCompare(b, "ko"); });
    $("region").innerHTML = '<option value="">전체 지역</option>' +
      opts.map(function (r) { return "<option>" + esc(r) + "</option>"; }).join("");
  }

  function monthLabel(ym) {
    return parseInt(ym.slice(0, 4), 10) + "년 " + parseInt(ym.slice(4), 10) + "월";
  }

  function renderTabs() {
    $("tabs").innerHTML = months.map(function (ym, i) {
      return '<button data-i="' + i + '" class="' + (i === current ? "on" : "") + '">' +
        monthLabel(ym) + "</button>";
    }).join("");
  }

  function renderTiles() {
    var from = DATA.range.from || "", to = DATA.range.to || "";
    var dayKeys = Object.keys(DATA.days || {});
    var availDays = 0, forestSet = {};
    dayKeys.forEach(function (k) {
      var es = entriesFor(k);
      if (es.length) {
        availDays++;
        es.forEach(function (e) { forestSet[e.name] = 1; });
      }
    });
    var html =
      tile("조회 지점", DATA.forests_scanned, "곳") +
      tile("빈자리 있는 날", availDays, "일") +
      tile("빈자리 지점", Object.keys(forestSet).length, "곳");
    if (DATA.fetch_failures > 0) {
      html += tile("조회 실패", DATA.fetch_failures, "건");
    }
    $("tiles").innerHTML = html;

    var gen = DATA.generated_at ? DATA.generated_at.replace("T", " ").slice(0, 16) : "?";
    $("meta").textContent = fmtDate(from) + " ~ " + fmtDate(to) +
      " · 마지막 갱신 " + gen;

    var banners = "";
    if (DATA.sample) {
      banners += '<div class="banner">⚠ 샘플 데이터입니다. 첫 배치 실행(deploy.sh) 후 실제 데이터로 바뀝니다.</div>';
    }
    if (DATA.fetch_failures > 0) {
      banners += '<div class="banner">⚠ 일부 지점(' + DATA.fetch_failures +
        '건) 조회에 실패했습니다. 표시되지 않은 빈자리가 있을 수 있습니다.</div>';
    }
    $("banners").innerHTML = banners;
  }

  function tile(k, v, unit) {
    return '<div class="tile"><div class="k">' + k + '</div><div class="v">' +
      (v == null ? "?" : v) + " <small>" + unit + "</small></div></div>";
  }

  function fmtDate(yyyymmdd) {
    if (!yyyymmdd || yyyymmdd.length !== 8) return "?";
    return parseInt(yyyymmdd.slice(4, 6), 10) + "/" + parseInt(yyyymmdd.slice(6), 10);
  }

  function renderGrid() {
    var ym = months[current];
    var year = parseInt(ym.slice(0, 4), 10), month = parseInt(ym.slice(4), 10);
    var first = new Date(year, month - 1, 1);
    var daysInMonth = new Date(year, month, 0).getDate();
    var startDow = first.getDay();
    var tk = todayKey();
    var from = DATA.range.from || "00000000", to = DATA.range.to || "99999999";

    var cells = [];
    for (var b = 0; b < startDow; b++) cells.push('<div class="day blank"></div>');

    for (var d = 1; d <= daysInMonth; d++) {
      var key = ym + String(d).padStart(2, "0");
      var dow = (startDow + d - 1) % 7;
      var cls = ["day"];
      if (dow === 0) cls.push("sun");
      if (dow === 6) cls.push("sat");
      if (key === tk) cls.push("today");

      var inRange = key >= from && key <= to;
      if (!inRange) cls.push("past");

      var inner = '<div class="num">' + d + "</div>";
      if (inRange) {
        var es = entriesFor(key);
        var opens = opensFor(d);
        if (es.length) {
          cls.push("has");
          cls.push(es.length >= 100 ? "t3" : es.length >= 40 ? "t2" : "t1");
          inner += '<div class="badge">' + es.length + "곳</div>";
          var names = es.slice(0, 2).map(function (e) {
            return "<div>" + esc(shortName(e.name)) + "</div>";
          }).join("");
          var more = es.length > 2 ? '<div class="more">+' + (es.length - 2) + "곳</div>" : "";
          inner += '<div class="mini">' + names + more + "</div>";
        }
        if (opens.length) {
          if (!es.length) cls.push("has");
          inner += '<div class="open">🔔 오픈 ' + opens.length + "곳</div>";
        }
      }
      cells.push('<div class="' + cls.join(" ") + '" data-key="' + key + '">' + inner + "</div>");
    }
    while (cells.length % 7 !== 0) cells.push('<div class="day blank"></div>');

    var weeks = [];
    for (var i = 0; i < cells.length; i += 7) {
      weeks.push('<div class="week">' + cells.slice(i, i + 7).join("") + "</div>");
    }
    $("grid").innerHTML = weeks.join("");
  }

  // 지점명은 "[공립](강릉시)임해자연휴양림" 형태로 온다.
  // 운영주체 대괄호와 시·군·구 소괄호를 떼어낸 순수 이름.
  function bareName(name) {
    return name.replace(/^\s*\[[^\]]*\]\s*/, "").replace(/^\s*\([^)]*\)\s*/, "").trim();
  }

  function sigungu(name) {
    var m = name.match(/^\s*(?:\[[^\]]*\])?\s*\(([^)]*)\)/);
    return m ? m[1] : "";
  }

  // 지도 검색어: 대괄호를 그대로 넘기면 두 지도 모두 결과가 0건이 된다.
  // 시·군·구를 앞에 붙이면 동명 휴양림도 정확히 잡힌다 ("강릉시 임해자연휴양림").
  function mapQuery(name) {
    var gu = sigungu(name), bare = bareName(name);
    return gu ? gu + " " + bare : bare;
  }

  // 숲나들e 예약 화면으로 직행. _csrf 와 netfunnel_key 는 붙이지 않는다 —
  // 세션마다 다른 값이라 남의 토큰은 무효이고, 없어도 로그인 상태면 정상 동작한다
  // (대기열이 걸려 있으면 숲나들e가 알아서 대기 화면을 띄운다).
  // 비로그인 상태에서는 로그인 화면이 뜨고, 로그인하면 이 화면으로 이어진다.
  var RESERVE_BASE = "https://www.foresttrip.go.kr/rep/or/sssn/fcfsRsrvtPssblGoodsDetls.do";

  // 날짜선택기 표시용 라벨: 20260829 → "26/08/29(토)"
  function useDtLabel(key) {
    var y = +key.slice(0, 4), m = +key.slice(4, 6), d = +key.slice(6);
    var dow = "일월화수목금토"[new Date(y, m - 1, d).getDay()];
    return key.slice(2, 4) + "/" + key.slice(4, 6) + "/" + key.slice(6) + "(" + dow + ")";
  }

  function nextDayKey(key) {
    var d = new Date(+key.slice(0, 4), +key.slice(4, 6) - 1, +key.slice(6) + 1);
    return "" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") +
      String(d.getDate()).padStart(2, "0");
  }

  function reserveUrl(entry, dateKey) {
    if (!entry.id) {  // 지점 ID 를 모르면 통합검색으로 폴백
      return "https://www.foresttrip.go.kr/pot/is/gs/selectGnrlSrchView.do?srchWord=" +
        encodeURIComponent(bareName(entry.name));
    }
    var out = nextDayKey(dateKey);
    var range = useDtLabel(dateKey) + "-" + useDtLabel(out);
    var params = [
      ["srchInsttId", entry.id],
      ["srchRsrvtBgDt", dateKey],
      ["srchRsrvtEdDt", out],
      ["srchSthngCnt", "1"],      // 1박
      ["srchStngNofpr", "2"],     // 기준 인원 (화면에서 변경 가능)
      ["srchUseDt", range],
      ["calPicker", range],
      ["rsrvtWtngSctin", "01"],
      ["menuId", "001001"],
      ["hmpgId", "FRIP"]
    ].map(function (p) { return p[0] + "=" + encodeURIComponent(p[1]); });
    return RESERVE_BASE + "?" + params.join("&");
  }

  // "[공립](가평군)강씨봉자연휴양림" → "강씨봉" (달력 셀 미리보기용 축약)
  function shortName(name) {
    return bareName(name).replace(/^국립\s*/, "").replace(/자연휴양림$/, "");
  }

  function openDetail(key) {
    var es = entriesFor(key);
    var y = key.slice(0, 4), m = parseInt(key.slice(4, 6), 10), d = parseInt(key.slice(6), 10);
    var opens = opensFor(d);
    if (!es.length && !opens.length) return;
    var dow = "일월화수목금토"[new Date(+y, m - 1, d).getDay()];
    $("dlg-title").textContent = y + "년 " + m + "월 " + d + "일 (" + dow + ") · 빈자리 " + es.length + "곳";

    var openHtml = "";
    if (opens.length) {
      openHtml = '<div class="open-section"><h4>🔔 이날 예약 오픈 (' + opens.length + "곳)</h4>" +
        opens.map(function (p) {
          return '<div class="open-row"><span>' + esc(p.name) + "</span><span>" + esc(p.rule) + "</span></div>";
        }).join("") + "</div>";
    }

    $("dlg-body").innerHTML = openHtml + es.map(function (e) {
      var rooms = hydrateRooms(e.slots).map(function (r) {
        var meta = [];
        if (r.category) meta.push(r.category);
        if (r.capacity != null) meta.push("최대 " + r.capacity + "인");
        if (r.area != null) meta.push(r.area + "㎡");
        var price = r.price != null
          ? '<strong class="rp">' + r.price.toLocaleString("ko-KR") + "원</strong>"
          : '<span class="rp unknown">가격 미확인</span>';
        return '<div class="room"><span class="rn">' + esc(r.name) +
          '</span><span class="rm">' + esc(meta.join(" · ")) +
          (meta.length ? " · " : "") + price + "</span></div>";
      }).join("");
      var q = encodeURIComponent(mapQuery(e.name));
      var maps = '<span class="maps">' +
        '<a href="https://map.kakao.com/link/search/' + q + '" target="_blank" rel="noopener">카카오맵</a>' +
        '<a href="https://map.naver.com/p/search/' + q + '" target="_blank" rel="noopener">네이버지도</a>' +
        "</span>";
      var policy = policyFor(e.name);
      var ruleLine = policy && policy.rule
        ? '<div class="rule">예약 오픈: ' + esc(policy.rule) + "</div>"
        : "";
      return '<div class="forest"><h3>' +
        '<a class="fname" href="' + reserveUrl(e, key) + '" target="_blank" rel="noopener"' +
        ' title="숲나들e 예약 화면으로 이동 (1박 기준)">' + esc(e.name) + "</a>" +
        '<span class="region">' + esc(e.region || "") + "</span>" + maps + "</h3>" +
        ruleLine + rooms + "</div>";
    }).join("");
    $("dlg").showModal();
  }

  function rerender() {
    renderTiles();
    renderTabs();
    renderGrid();
  }

  // ── 이벤트 ──────────────────────────────────────────────
  $("tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    current = parseInt(b.dataset.i, 10);
    renderTabs();
    renderGrid();
  });
  $("filter").addEventListener("input", function () {
    filterText = this.value.trim();
    rerender();
  });
  $("region").addEventListener("change", function () {
    regionFilter = this.value;
    rerender();
  });
  $("price").addEventListener("change", function () {
    maxPrice = parseInt(this.value, 10) || 0;
    rerender();
  });
  $("grid").addEventListener("click", function (ev) {
    var cell = ev.target.closest(".day.has");
    if (cell) openDetail(cell.dataset.key);
  });
  $("dlg-close").addEventListener("click", function () { $("dlg").close(); });
  $("dlg").addEventListener("click", function (ev) {
    if (ev.target === this) this.close();
  });

  // ── 데이터 로드 ─────────────────────────────────────────
  fetch("data/vacancy.json?v=" + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (json) {
      if (json.v !== 2) {
        throw new Error("데이터 형식(v" + (json.v || 1) + ")이 이 페이지와 맞지 않습니다");
      }
      DATA = json;
      FORESTS = DATA.forests || [];
      ROOMS = DATA.rooms || [];
      CATEGORIES = DATA.categories || [];
      var from = DATA.range.from, to = DATA.range.to;
      var seen = {};
      months = [];
      if (from && to) {
        var y = parseInt(from.slice(0, 4), 10), m = parseInt(from.slice(4, 6), 10);
        var endYm = to.slice(0, 6);
        for (var guard = 0; guard < 12; guard++) {
          var ym = "" + y + String(m).padStart(2, "0");
          if (!seen[ym]) { seen[ym] = 1; months.push(ym); }
          if (ym === endYm) break;
          m++; if (m > 12) { m = 1; y++; }
        }
      }
      if (!months.length) months = [todayKey().slice(0, 6)];
      var curYm = todayKey().slice(0, 6);
      current = Math.max(0, months.indexOf(curYm));
      buildPolicyIndex();
      populateRegions();
      rerender();
    })
    .catch(function (err) {
      $("meta").textContent = "데이터를 불러오지 못했습니다: " + err.message;
      // file:// 로 열면 브라우저가 같은 폴더의 JSON 조차 CORS 로 막는다.
      // 파일이 없는 것과 구분해서 안내한다.
      var isFile = location.protocol === "file:";
      $("grid").innerHTML = '<div class="empty-note">' + (isFile
        ? "브라우저가 <code>file://</code> 로 열린 페이지의 데이터 읽기를 막았습니다.<br>" +
          "로컬에서 볼 때는 간단한 서버로 띄워 주세요:<br><br>" +
          "<code>python3 -m http.server 8765 -d docs</code><br>" +
          "→ http://localhost:8765<br><br>" +
          "GitHub Pages 에 올린 뒤에는 그냥 주소만 열면 됩니다."
        : "data/vacancy.json 을 읽지 못했습니다. 배치(deploy.sh)가 한 번은 돌았는지 확인해 주세요."
      ) + "</div>";
    });
})();
</script>
</body>
</html>
