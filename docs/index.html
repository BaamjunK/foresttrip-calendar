<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>휴양림 빈자리 달력</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f4f2;
    --surface-1: #fcfcfb;
    --surface-2: #eeeeea;
    --border: #dddad2;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a887f;
    --accent: #008300;          /* 예약 가능 = good */
    --accent-ink: #006400;
    --tint-1: rgba(0,131,0,.10);  /* 1~2곳 */
    --tint-2: rgba(0,131,0,.20);  /* 3~9곳 */
    --tint-3: rgba(0,131,0,.32);  /* 10곳+ */
    --sun: #c03434;
    --sat: #2a78d6;
    --warn-bg: #fdf3e0;
    --warn-ink: #8a5a00;
    --shadow: 0 8px 28px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --surface-2: #242422;
      --border: #3a3a36;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #83817a;
      --accent: #35a835;
      --accent-ink: #6fce6f;
      --tint-1: rgba(53,168,53,.14);
      --tint-2: rgba(53,168,53,.26);
      --tint-3: rgba(53,168,53,.40);
      --sun: #e66767;
      --sat: #3987e5;
      --warn-bg: #35290f;
      --warn-ink: #e5b96a;
      --shadow: 0 8px 28px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --surface-2: #242422;
    --border: #3a3a36;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #83817a;
    --accent: #35a835;
    --accent-ink: #6fce6f;
    --tint-1: rgba(53,168,53,.14);
    --tint-2: rgba(53,168,53,.26);
    --tint-3: rgba(53,168,53,.40);
    --sun: #e66767;
    --sat: #3987e5;
    --warn-bg: #35290f;
    --warn-ink: #e5b96a;
    --shadow: 0 8px 28px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.5;
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }

  header h1 { font-size: 1.35rem; font-weight: 700; }
  header .sub { color: var(--text-secondary); font-size: .85rem; margin-top: 2px; }

  .banner {
    margin-top: 12px; padding: 8px 12px; border-radius: 8px;
    background: var(--warn-bg); color: var(--warn-ink); font-size: .85rem;
  }

  .tiles { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
  .tile {
    flex: 1 1 120px; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px;
  }
  .tile .k { font-size: .75rem; color: var(--text-secondary); }
  .tile .v { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: .8rem; font-weight: 400; color: var(--text-muted); }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .controls input, .controls select {
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-primary); font-size: .9rem;
  }
  .controls input[type="search"] { flex: 1 1 140px; min-width: 110px; }
  .controls select { flex: 0 0 auto; cursor: pointer; }
  .controls input:focus, .controls select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .pricebox {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-1); padding: 0 10px 0 4px;
  }
  .pricebox input {
    width: 58px; border: none; background: none; padding: 8px 4px;
    font-size: .9rem; font-variant-numeric: tabular-nums; text-align: right;
  }
  .pricebox input:focus { outline: none; }
  .pricebox:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }
  .pricebox .tilde { color: var(--text-muted); font-size: .85rem; }
  .pricebox .unit { color: var(--text-secondary); font-size: .8rem; }

  #reset {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-secondary);
    font-size: .85rem; cursor: pointer;
  }
  #reset:hover { border-color: var(--accent); color: var(--accent-ink); }
  .pill {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-secondary);
    font-size: .85rem; cursor: pointer; white-space: nowrap;
  }

  /* 다중 선택 드롭다운 — select 는 값을 하나만 담아 여러 지역을 못 고른다 */
  .multi { position: relative; }
  .multi > summary {
    list-style: none; cursor: pointer; white-space: nowrap;
    padding: 8px 26px 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-primary); font-size: .9rem;
  }
  .multi > summary::-webkit-details-marker { display: none; }
  .multi > summary::after {
    content: "⌄"; position: absolute; right: 10px; top: 5px;
    color: var(--text-muted); font-size: .85rem;
  }
  .multi[open] > summary { border-color: var(--accent); }
  .multi > summary.on {
    background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600;
  }
  .multi > summary.on::after { color: #fff; }
  .multi-panel {
    position: absolute; z-index: 20; top: calc(100% + 4px); left: 0;
    min-width: 160px; max-width: calc(100vw - 24px);
    max-height: 260px; overflow-y: auto;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow); padding: 6px;
  }
  /* 좁은 화면에서 오른쪽 끝 버튼의 패널이 화면 밖으로 나가는 걸 막는다 */
  .multi-panel.align-right { left: auto; right: 0; }
  .multi-panel label {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 6px 8px; border-radius: 6px; font-size: .85rem;
    color: var(--text-secondary); white-space: nowrap;
  }
  .multi-panel label:hover { background: var(--surface-2); }
  .multi-panel input { accent-color: var(--accent); }
  .pill:hover { border-color: var(--accent); color: var(--accent-ink); }
  .pill[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 700;
  }
  /* 상세 팝업의 관심 등록 별 */
  .fav {
    border: none; background: none; cursor: pointer; padding: 0 2px;
    font-size: .95rem; line-height: 1; color: var(--text-muted);
  }
  .fav:hover { color: var(--warn-ink); }
  .fav[aria-pressed="true"] { color: #eda100; }
  .tabs { display: flex; gap: 6px; }
  .tabs button {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-secondary);
    font-size: .9rem; cursor: pointer;
  }
  .tabs button.on {
    background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 700;
  }

  .cal { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .dow, .week { display: grid; grid-template-columns: repeat(7, 1fr); }
  .dow div {
    padding: 8px 0; text-align: center; font-size: .78rem;
    color: var(--text-secondary); background: var(--surface-2);
  }
  .dow div:first-child { color: var(--sun); }
  .dow div:last-child { color: var(--sat); }
  .day {
    min-height: 86px; padding: 6px; border-top: 1px solid var(--border);
    border-left: 1px solid var(--border); position: relative;
    display: flex; flex-direction: column; gap: 3px;
  }
  .week .day:first-child { border-left: none; }
  .day.blank { background: var(--surface-2); opacity: .45; }
  .day.past .num, .day.past .mini { opacity: .38; }
  .day .num { font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .day.sun .num { color: var(--sun); }
  .day.sat .num { color: var(--sat); }
  .day.today .num::after {
    content: "오늘"; margin-left: 4px; font-size: .62rem; font-weight: 700;
    color: var(--accent-ink);
  }
  .day.has { cursor: pointer; }
  .day.t1 { background: var(--tint-1); }
  .day.t2 { background: var(--tint-2); }
  .day.t3 { background: var(--tint-3); }
  .day.has:hover { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
  .badge {
    align-self: flex-start; font-size: .72rem; font-weight: 700;
    color: #fff; background: var(--accent); border-radius: 999px; padding: 1px 8px;
  }
  .mini { font-size: .68rem; color: var(--text-secondary); overflow: hidden; }
  .mini div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .more { color: var(--text-muted); }

  dialog {
    border: 1px solid var(--border); border-radius: 14px; padding: 0;
    background: var(--surface-1); color: var(--text-primary);
    width: min(560px, calc(100vw - 32px)); max-height: 80vh; box-shadow: var(--shadow);
  }
  /* 내용이 max-height 를 넘으면 본문만 스크롤되어야 한다. dialog 가 block 이면
     본문이 제한을 못 받아 팝업이 화면 위아래로 삐져나간다(빈자리 수십 곳인
     날짜에서 오픈 섹션이 헤더 위로 잘려 나갔다). open 상태에서만 flex 로 만들어
     닫힘(display:none)을 깨지 않는다. */
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface-1);
  }
  .dlg-head h2 { font-size: 1rem; }
  .dlg-head button {
    border: none; background: none; font-size: 1.2rem; cursor: pointer;
    color: var(--text-secondary); padding: 4px 8px;
  }
  /* min-height:0 이 없으면 flex 아이템이 내용 높이만큼 부풀어 스크롤이 안 생긴다 */
  .dlg-body { padding: 10px 18px 18px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .forest { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .forest:last-child { border-bottom: none; }
  .forest h3 { font-size: .92rem; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .forest h3 .region { font-size: .75rem; font-weight: 400; color: var(--text-muted); }
  .forest h3 .fname {
    color: var(--text-primary); text-decoration: none;
    border-bottom: 1px solid var(--border);
  }
  .forest h3 .fname:hover { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .forest h3 .fname::after { content: " ↗"; font-size: .7rem; color: var(--text-muted); }
  .forest h3 .maps { margin-left: auto; display: flex; gap: 6px; }
  .maps a {
    font-size: .7rem; font-weight: 400; text-decoration: none;
    color: var(--text-secondary); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }
  .maps a:hover { border-color: var(--accent); color: var(--accent-ink); }
  .room { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; padding: 3px 0; }
  .room .rn { color: var(--text-secondary); }
  .room .rm { color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .room .rp { color: var(--text-primary); font-weight: 600; }
  .room .rp.unknown { color: var(--text-muted); font-weight: 400; }
  .forest .rule { font-size: .74rem; color: var(--warn-ink); margin: 2px 0 4px; }

  .day .open {
    font-size: .64rem; font-weight: 600; color: var(--warn-ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .open-section {
    background: var(--warn-bg); border-radius: 10px;
    padding: 10px 14px; margin: 12px 0 4px;
  }
  .open-section h4 { font-size: .82rem; color: var(--warn-ink); margin-bottom: 4px; }
  .open-row {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: .78rem; color: var(--text-secondary); padding: 3px 0;
  }
  .open-row span:last-child { color: var(--text-muted); white-space: nowrap; }
  .open-note {
    margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border);
    font-size: .7rem; line-height: 1.45; color: var(--text-muted);
  }
  .open-row .ol { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .open-row .ol a { color: var(--text-secondary); text-decoration: none; border-bottom: 1px solid var(--border); }
  .open-row .ol a:hover { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .open-row .ol a::after { content: " ↗"; font-size: .68rem; color: var(--text-muted); }
  .otag { font-style: normal; font-size: .68rem; color: var(--text-muted); }
  .otag.lot {
    color: var(--warn-ink); border: 1px solid var(--warn-ink);
    border-radius: 999px; padding: 0 6px; opacity: .85;
  }

  footer { margin-top: 18px; font-size: .75rem; color: var(--text-muted); }
  footer a { color: inherit; }
  .empty-note { padding: 30px; text-align: center; color: var(--text-muted); font-size: .9rem; }

  @media (max-width: 560px) {
    .day { min-height: 64px; }
    .mini { display: none; }
    .badge { font-size: .66rem; padding: 1px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌲 휴양림 빈자리 달력</h1>
    <div class="sub" id="meta">데이터 불러오는 중…</div>
  </header>

  <div id="banners"></div>

  <div class="tiles" id="tiles"></div>

  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <details class="multi" id="regionbox">
      <summary aria-label="지역 필터">전체 지역</summary>
      <div class="multi-panel" id="regionopts"></div>
    </details>
    <details class="multi" id="typebox">
      <summary aria-label="운영주체 필터">전체 주체</summary>
      <div class="multi-panel" id="typeopts"></div>
    </details>
    <span class="pricebox">
      <input id="cmin" type="number" min="0" step="1" placeholder="최소"
             inputmode="numeric" aria-label="최소 정원(인)">
      <span class="tilde">~</span>
      <input id="cmax" type="number" min="0" step="1" placeholder="최대"
             inputmode="numeric" aria-label="최대 정원(인)">
      <span class="unit">인</span>
    </span>
    <span class="pricebox">
      <input id="pmin" type="number" min="0" step="1" placeholder="최소"
             inputmode="numeric" aria-label="최소 요금(만원)">
      <span class="tilde">~</span>
      <input id="pmax" type="number" min="0" step="1" placeholder="최대"
             inputmode="numeric" aria-label="최대 요금(만원)">
      <span class="unit">만원</span>
    </span>
    <input id="filter" type="search" placeholder="휴양림명" autocomplete="off">
    <button id="favonly" type="button" class="pill" hidden aria-pressed="false"></button>
    <button id="share" type="button" class="pill">🔗 링크 복사</button>
    <button id="reset" type="button" hidden>필터 초기화</button>
  </div>

  <div class="cal">
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div id="grid"></div>
  </div>

  <footer>
    출처: <a href="https://www.foresttrip.go.kr" target="_blank" rel="noopener">숲나들e</a>
    · 숙박 시설 기준 · 매일 아침 자동 갱신 · 가격은 1박 기준(성수기·주말 반영, 기준인원 초과 요금 별도)이며
    "가격 미확인" 객실은 다음 갱신에서 순차 채워집니다 · 실제 예약 가능 여부는 숲나들e에서 최종 확인하세요.
  </footer>
</div>

<dialog id="dlg">
  <div class="dlg-head">
    <h2 id="dlg-title"></h2>
    <button id="dlg-close" aria-label="닫기">✕</button>
  </div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>

<script>
(function () {
  "use strict";
  var DATA = null;
  // vacancy.json 은 중복을 걷어낸 인덱스 참조형(schema v2)이다. 마스터 배열을
  // 그대로 들고, 날짜별 데이터는 필요한 순간에만 풀어 쓴다(5만 건을 미리
  // 객체로 펼치면 메모리만 낭비된다).
  var FORESTS = [];      // [이름, 지점ID, 지역] — 빈자리가 있어 달력에 실린 지점
  var DIRECTORY = [];    // 같은 형식의 전 지점 목록(빈자리 없는 곳 포함)
  var LOTTERY = {};      // 지점ID -> true (월추첨제 병행, 배치가 매일 판정)
  var ROOMS = [];        // [이름, 유형idx, 정원, 면적]
  var CATEGORIES = [];
  var months = [];       // ["202608","202609"]
  var current = 0;       // months 인덱스
  var filterText = "";
  var minPrice = 0;      // 원 단위, 0 = 하한 없음
  var maxPrice = 0;      // 원 단위, 0 = 상한 없음
  var minPeople = 0;     // 수용 인원 하한, 0 = 없음
  var maxPeople = 0;     // 수용 인원 상한, 0 = 없음
  // 지역·운영주체는 여러 개를 함께 고를 수 있다. 빈 배열 = 전체.
  var regionSel = [];
  var typeSel = [];
  var favorites = {};    // 지점ID -> true (관심 휴양림)
  var favOnly = false;   // 관심 휴양림만 보기

  function has(list, v) { return list.length === 0 || list.indexOf(v) !== -1; }

  // 필터 조건과 관심 목록은 브라우저에 남겨 다음에 열 때 그대로 복원한다.
  // 관심 목록은 이름이 바뀌어도 견디도록 지점 ID 로 저장한다.
  var STORE_FILTERS = "foresttrip-calendar.filters";
  var STORE_FAVS = "foresttrip-calendar.favorites";

  // 저장·URL 공유가 같은 형태를 쓰도록 상태를 한 곳에서 만든다
  function currentState() {
    return {
      region: regionSel, type: typeSel, text: filterText,
      cmin: minPeople, cmax: maxPeople,
      pmin: minPrice, pmax: maxPrice, favOnly: favOnly
    };
  }

  function applyState(s) {
    if (!s) return;
    // 이전 버전은 문자열 하나만 저장했다 — 배열로 받아 준다
    regionSel = [].concat(s.region || []).filter(Boolean);
    typeSel = [].concat(s.type || []).filter(Boolean);
    filterText = s.text || "";
    minPeople = s.cmin || 0; maxPeople = s.cmax || 0;
    minPrice = s.pmin || 0; maxPrice = s.pmax || 0;
    favOnly = !!s.favOnly;
  }

  function saveState() {
    try {
      localStorage.setItem(STORE_FILTERS, JSON.stringify(currentState()));
      localStorage.setItem(STORE_FAVS, JSON.stringify(Object.keys(favorites)));
    } catch (e) { /* 시크릿 모드 등 저장 불가 — 기능은 그대로 동작 */ }
  }

  function loadState() {
    try {
      (JSON.parse(localStorage.getItem(STORE_FAVS)) || []).forEach(function (id) {
        favorites[id] = true;
      });
      applyState(JSON.parse(localStorage.getItem(STORE_FILTERS)));
    } catch (e) { /* 저장값이 깨졌으면 기본값으로 시작 */ }
  }

  // ── URL 공유 ──────────────────────────────────────────────
  // 주소에 조건이 실려 있으면 그쪽을 따른다(링크로 받은 조건이 내 저장값보다
  // 우선이어야 공유가 의미 있다). 관심 목록도 함께 실어 그대로 재현한다.
  function stateToQuery() {
    var q = [];
    var put = function (k, v) { if (v) q.push(k + "=" + encodeURIComponent(v)); };
    put("r", regionSel.join(","));
    put("t", typeSel.join(","));
    put("q", filterText);
    put("cmin", minPeople || "");
    put("cmax", maxPeople || "");
    put("pmin", minPrice ? minPrice / 10000 : "");
    put("pmax", maxPrice ? maxPrice / 10000 : "");
    var favIds = Object.keys(favorites);
    if (favIds.length) put("fav", favIds.join(","));
    if (favOnly) q.push("favonly=1");
    return q.join("&");
  }

  function readQuery() {
    var raw = location.search.replace(/^\?/, "");
    if (!raw) return false;
    var p = {};
    raw.split("&").forEach(function (pair) {
      var i = pair.indexOf("=");
      if (i > 0) p[pair.slice(0, i)] = decodeURIComponent(pair.slice(i + 1).replace(/\+/g, " "));
    });
    var known = ["r", "t", "q", "cmin", "cmax", "pmin", "pmax", "fav", "favonly"];
    if (!known.some(function (k) { return k in p; })) return false;
    var list = function (v) { return v ? v.split(",").filter(Boolean) : []; };
    var num = function (v) { var n = parseFloat(v); return n > 0 ? n : 0; };
    applyState({
      region: list(p.r), type: list(p.t), text: p.q || "",
      cmin: num(p.cmin), cmax: num(p.cmax),
      pmin: num(p.pmin) * 10000, pmax: num(p.pmax) * 10000,
      favOnly: p.favonly === "1"
    });
    if ("fav" in p) {
      favorites = {};
      list(p.fav).forEach(function (id) { favorites[id] = true; });
    }
    return true;
  }

  // 복원한 값을 입력 요소에 반영 (요금은 만원 단위로 되돌린다)
  function applyStateToControls() {
    $("filter").value = filterText;
    $("cmin").value = minPeople || "";
    $("cmax").value = maxPeople || "";
    $("pmin").value = minPrice ? minPrice / 10000 : "";
    $("pmax").value = maxPrice ? maxPrice / 10000 : "";
  }

  function favCount() { return Object.keys(favorites).length; }

  function renderFavToggle() {
    var n = favCount();
    var btn = $("favonly");
    btn.hidden = n === 0;
    if (n === 0) { favOnly = false; return; }
    btn.textContent = "⭐ 관심 " + n + "곳만";
    btn.setAttribute("aria-pressed", favOnly ? "true" : "false");
  }

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var norm = function (s) { return String(s).replace(/\s+/g, ""); };

  function todayKey() {
    var now = new Date();
    return "" + now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, "0") +
      String(now.getDate()).padStart(2, "0");
  }

  function roomFilterOn() {
    return minPrice > 0 || maxPrice > 0 || minPeople > 0 || maxPeople > 0;
  }

  // 객실 단위 조건(요금 범위·정원 범위). 요금 조건이 걸리면 "가격 미확인"(0)은
  // 판정이 불가능하므로 제외한다. 정원은 객실 정원(최대 수용 인원) 기준이라
  // "2~4인"은 정원이 그 범위에 드는 객실만 남긴다 — 하한만 걸면 대형 객실까지
  // 전부 걸려 사실상 필터가 되지 않는다.
  function slotPasses(s) {
    var price = s[1];
    if (minPrice > 0 || maxPrice > 0) {
      if (!price) return false;
      if (minPrice > 0 && price < minPrice) return false;
      if (maxPrice > 0 && price > maxPrice) return false;
    }
    if (minPeople > 0 || maxPeople > 0) {
      var r = ROOMS[s[0]];
      var cap = r && r[2];
      if (!cap) return false;                        // 정원 미상은 판정 불가
      if (minPeople > 0 && cap < minPeople) return false;
      if (maxPeople > 0 && cap > maxPeople) return false;
    }
    return true;
  }

  // "[공립](강릉시)임해자연휴양림" → "공립"
  function operatorType(name) {
    return (String(name).match(/^\s*\[([^\]]*)\]/) || [])[1] || "";
  }

  // 필터(지역 + 요금 + 인원 + 휴양림명) 적용된 해당 날짜의 지점 목록.
  // 반환 원소는 {name, id, region, slots} — slots 는 [객실idx, 요금] 쌍 그대로다.
  // 객실 상세는 팝업을 열 때만 풀어내므로 달력 렌더링은 마스터 조회 몇 번으로 끝난다.
  // 객실 조건을 통과한 객실이 하나도 없는 지점은 그 날짜에서 빠진다.
  function entriesFor(dateKey) {
    var list = (DATA.days && DATA.days[dateKey]) || [];
    var needle = filterText ? norm(filterText) : null;
    var byRoom = roomFilterOn();
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var f = FORESTS[list[i][0]];
      if (!f) continue;
      if (favOnly && !favorites[f[1]]) continue;
      if (!has(regionSel, FOREST_WIDE[list[i][0]])) continue;
      if (!has(typeSel, operatorType(f[0]))) continue;
      if (needle && norm(f[0]).indexOf(needle) === -1) continue;
      var slots = list[i][1];
      if (byRoom) {
        slots = slots.filter(slotPasses);
        if (!slots.length) continue;
      }
      out.push({ name: f[0], id: f[1], region: f[2], slots: slots });
    }
    return out;
  }

  // 팝업에 뿌릴 객실 목록으로 풀어낸다 (요금 0 = 미확인 → null)
  function hydrateRooms(slots) {
    return slots.map(function (s) {
      var r = ROOMS[s[0]] || ["", 0, 0, 0];
      return {
        name: r[0],
        category: CATEGORIES[r[1]] || "",
        capacity: r[2] || null,
        area: r[3] || null,
        price: s[1] > 0 ? s[1] : null
      };
    });
  }

  // 정책 표와 조회 데이터의 지점명 표기가 다르다:
  //   조회   "[공립](광양시)백운산자연휴양림"
  //   정책   "광양백운산자연휴양림" (시 이름이 이름에 붙어 있음)
  // 이름만으로 맞추면 국립 백운산(원주시) 규칙이 엉뚱하게 붙으므로
  // 운영주체 + 시·군·구까지 일치해야 인정하고, 애매하면 규칙을 표시하지 않는다.
  var byTypeGu = {};      // "주체|시군구" -> [policy]
  var byTypeName = {};    // "주체|이름" -> [policy]
  var openByDay = {};     // 매월 고정 오픈일(1~31) -> [policy, ...]

  function buildPolicyIndex() {
    (DATA.policies || []).forEach(function (p) {
      var gu = p.type + "|" + p.sigungu;
      (byTypeGu[gu] = byTypeGu[gu] || []).push(p);
      var nm = p.type + "|" + norm(p.name);
      (byTypeName[nm] = byTypeName[nm] || []).push(p);
      if (p.open_day) (openByDay[p.open_day] = openByDay[p.open_day] || []).push(p);
    });
  }

  // 두 소스의 이름 표기가 제각각이라 단계적으로 좁힌다. 확정할 수 없으면
  // null 을 돌려 규칙을 감춘다 — 틀린 오픈일을 보여주는 쪽이 더 나쁘다.
  function policyFor(forestName) {
    var type = (forestName.match(/^\s*\[([^\]]*)\]/) || [])[1] || "";
    var gu = sigungu(forestName);
    var bare = norm(bareName(forestName));
    if (!type) return null;

    var group = byTypeGu[type + "|" + gu] || [];
    var exact = group.filter(function (p) { return norm(p.name) === bare; });
    if (exact.length === 1) return exact[0];
    // "광양백운산자연휴양림" ⊃ "백운산자연휴양림" 처럼 시 이름이 붙은 표기
    var partial = group.filter(function (p) {
      var n = norm(p.name);
      return n.indexOf(bare) !== -1 || bare.indexOf(n) !== -1;
    });
    if (partial.length === 1) return partial[0];
    if (group.length === 1) return group[0];
    // 시·군·구 표기가 어긋나는 경우("대구시" vs "달성군") — 이름이 전국에서
    // 유일할 때만 인정한다
    var byName = byTypeName[type + "|" + bare] || [];
    if (byName.length === 1) return byName[0];
    return null;
  }

  // 정책 → 지점 역방향. 오픈 목록에서도 예약 링크·지역을 보여주려면 지점 ID 가
  // 필요한데 정책 표에는 없다. 빈자리가 있어 달력에 실린 지점만 연결되고,
  // 나머지(그 기간 빈자리가 없는 곳)는 링크 없이 정책 정보만 보여준다.
  var forestOfPolicy = null;   // Map<policy, [이름, 지점ID, 지역]>

  function buildForestLinks() {
    forestOfPolicy = new Map();
    // 달력에 실린 지점을 먼저 연결하고(그쪽 지역 정보가 조회 결과와 일치한다),
    // 빈자리가 없어 안 실린 지점은 전 지점 목록에서 마저 채운다.
    // 이게 없으면 "수락산 동막골"처럼 그 기간 빈자리가 없는 곳은 지점 ID 를
    // 못 찾아 검색 폴백으로 밀린다.
    [FORESTS, DIRECTORY].forEach(function (source) {
      source.forEach(function (f) {
        var p = policyFor(f[0]);
        if (p && !forestOfPolicy.has(p)) forestOfPolicy.set(p, f);
      });
    });
  }

  // 해당 날짜에 예약이 오픈되는 휴양림 목록.
  // 달력 본체와 같은 기준(이름·지역·운영주체)으로 걸러 필터와 어긋나지 않게 한다.
  // 요금·정원은 객실 단위 조건이라 오픈 목록에는 적용하지 않는다.
  function opensFor(dayOfMonth) {
    var list = openByDay[dayOfMonth] || [];
    var needle = filterText ? norm(filterText) : null;
    return list.filter(function (p) {
      var f = forestOfPolicy && forestOfPolicy.get(p);
      if (favOnly && !(f && favorites[f[1]])) return false;
      if (needle && norm(p.name).indexOf(needle) === -1 &&
          !(f && norm(f[0]).indexOf(needle) !== -1)) return false;
      if (!has(typeSel, p.type)) return false;
      if (regionSel.length) {
        // 달력에 실린 지점이면 그 지점의 광역, 아니면 정책 표 값으로 판정한다
        var w = f ? wideArea(f[2], sigungu(f[0])) : wideArea(p.region, p.sigungu);
        if (!has(regionSel, w)) return false;
      }
      return true;
    });
  }

  // 체크박스 목록을 그리고, 요약(summary)에 고른 값을 압축해 보여준다
  function renderMulti(boxId, panelId, options, selected, allLabel) {
    $(panelId).innerHTML = options.map(function (v) {
      return '<label><input type="checkbox" value="' + esc(v) + '"' +
        (selected.indexOf(v) !== -1 ? " checked" : "") + ">" + esc(v) + "</label>";
    }).join("");
    var sum = $(boxId).querySelector("summary");
    if (!selected.length) {
      sum.textContent = allLabel;
      sum.classList.remove("on");
    } else {
      sum.textContent = selected.length <= 2
        ? selected.join("·")
        : selected[0] + " 외 " + (selected.length - 1);
      sum.classList.add("on");
    }
  }

  var regionOptions = [], typeOptions = [];

  function populateRegions() {
    // 지점 마스터에는 빈자리가 있는 지점만 담겨 있어 그대로 지역 목록이 된다
    var seen = {};
    FOREST_WIDE.forEach(function (w) { if (w) seen[w] = 1; });
    regionOptions = Object.keys(seen).sort(function (a, b) {
      var ia = WIDE_ORDER.indexOf(a), ib = WIDE_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
  }

  function populateTypes() {
    var seen = {};
    FORESTS.forEach(function (f) {
      var t = operatorType(f[0]);
      if (t) seen[t] = 1;
    });
    // 국립 → 공립 → 사립 순으로 고정(가나다순이면 공립이 앞에 와 어색하다)
    var order = ["국립", "공립", "사립"];
    typeOptions = Object.keys(seen).sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
  }

  // 저장·공유로 받은 값 중 이번 데이터에 없는 것은 조용히 버린다(지점 구성이
  // 매일 바뀌므로 남겨 두면 결과가 0건이 되어 버린다)
  function pruneSelections() {
    regionSel = regionSel.filter(function (v) { return regionOptions.indexOf(v) !== -1; });
    typeSel = typeSel.filter(function (v) { return typeOptions.indexOf(v) !== -1; });
  }

  function renderFilterMenus() {
    renderMulti("regionbox", "regionopts", regionOptions, regionSel, "전체 지역");
    renderMulti("typebox", "typeopts", typeOptions, typeSel, "전체 주체");
  }

  function monthLabel(ym) {
    return parseInt(ym.slice(0, 4), 10) + "년 " + parseInt(ym.slice(4), 10) + "월";
  }

  function renderTabs() {
    $("tabs").innerHTML = months.map(function (ym, i) {
      return '<button data-i="' + i + '" class="' + (i === current ? "on" : "") + '">' +
        monthLabel(ym) + "</button>";
    }).join("");
  }

  function renderTiles() {
    var from = DATA.range.from || "", to = DATA.range.to || "";
    var dayKeys = Object.keys(DATA.days || {});
    var availDays = 0, forestSet = {}, roomCount = 0;
    dayKeys.forEach(function (k) {
      var es = entriesFor(k);
      if (es.length) {
        availDays++;
        es.forEach(function (e) {
          forestSet[e.name] = 1;
          roomCount += e.slots.length;
        });
      }
    });
    var html =
      tile("조건에 맞는 날", availDays, "일") +
      tile("휴양림", Object.keys(forestSet).length, "곳") +
      tile("객실", roomCount.toLocaleString("ko-KR"), "건");
    if (DATA.fetch_failures > 0) {
      html += tile("조회 실패", DATA.fetch_failures, "건");
    }
    $("tiles").innerHTML = html;

    var gen = DATA.generated_at ? DATA.generated_at.replace("T", " ").slice(0, 16) : "?";
    $("meta").textContent = fmtDate(from) + " ~ " + fmtDate(to) +
      " · 전국 " + DATA.forests_scanned + "곳 조회 · 마지막 갱신 " + gen;

    var banners = "";
    if (DATA.sample) {
      banners += '<div class="banner">⚠ 샘플 데이터입니다. 첫 배치 실행(deploy.sh) 후 실제 데이터로 바뀝니다.</div>';
    }
    if (DATA.fetch_failures > 0) {
      banners += '<div class="banner">⚠ 일부 지점(' + DATA.fetch_failures +
        '건) 조회에 실패했습니다. 표시되지 않은 빈자리가 있을 수 있습니다.</div>';
    }
    $("banners").innerHTML = banners;
  }

  function tile(k, v, unit) {
    return '<div class="tile"><div class="k">' + k + '</div><div class="v">' +
      (v == null ? "?" : v) + " <small>" + unit + "</small></div></div>";
  }

  function fmtDate(yyyymmdd) {
    if (!yyyymmdd || yyyymmdd.length !== 8) return "?";
    return parseInt(yyyymmdd.slice(4, 6), 10) + "/" + parseInt(yyyymmdd.slice(6), 10);
  }

  function renderGrid() {
    var ym = months[current];
    var year = parseInt(ym.slice(0, 4), 10), month = parseInt(ym.slice(4), 10);
    var first = new Date(year, month - 1, 1);
    var daysInMonth = new Date(year, month, 0).getDate();
    var startDow = first.getDay();
    var tk = todayKey();
    var from = DATA.range.from || "00000000", to = DATA.range.to || "99999999";

    var cells = [];
    for (var b = 0; b < startDow; b++) cells.push('<div class="day blank"></div>');

    for (var d = 1; d <= daysInMonth; d++) {
      var key = ym + String(d).padStart(2, "0");
      var dow = (startDow + d - 1) % 7;
      var cls = ["day"];
      if (dow === 0) cls.push("sun");
      if (dow === 6) cls.push("sat");
      if (key === tk) cls.push("today");

      var inRange = key >= from && key <= to;
      if (!inRange) cls.push("past");

      var inner = '<div class="num">' + d + "</div>";
      if (inRange) {
        var es = entriesFor(key);
        var opens = opensFor(d);
        if (es.length) {
          cls.push("has");
          cls.push(es.length >= 100 ? "t3" : es.length >= 40 ? "t2" : "t1");
          inner += '<div class="badge">' + es.length + "곳</div>";
          var names = es.slice(0, 2).map(function (e) {
            return "<div>" + esc(shortName(e.name)) + "</div>";
          }).join("");
          var more = es.length > 2 ? '<div class="more">+' + (es.length - 2) + "곳</div>" : "";
          inner += '<div class="mini">' + names + more + "</div>";
        }
        if (opens.length) {
          if (!es.length) cls.push("has");
          inner += '<div class="open">🔔 오픈 ' + opens.length + "곳</div>";
        }
      }
      cells.push('<div class="' + cls.join(" ") + '" data-key="' + key + '">' + inner + "</div>");
    }
    while (cells.length % 7 !== 0) cells.push('<div class="day blank"></div>');

    var weeks = [];
    for (var i = 0; i < cells.length; i += 7) {
      weeks.push('<div class="week">' + cells.slice(i, i + 7).join("") + "</div>");
    }
    $("grid").innerHTML = weeks.join("");
  }

  // 지점명은 "[공립](강릉시)임해자연휴양림" 형태로 온다.
  // 운영주체 대괄호와 시·군·구 소괄호를 떼어낸 순수 이름.
  function bareName(name) {
    return name.replace(/^\s*\[[^\]]*\]\s*/, "").replace(/^\s*\([^)]*\)\s*/, "").trim();
  }

  function sigungu(name) {
    var m = name.match(/^\s*(?:\[[^\]]*\])?\s*\(([^)]*)\)/);
    return m ? m[1] : "";
  }

  // 지도 검색어: 대괄호를 그대로 넘기면 두 지도 모두 결과가 0건이 된다.
  // 시·군·구를 앞에 붙이면 동명 휴양림도 정확히 잡힌다 ("강릉시 임해자연휴양림").
  function mapQuery(name) {
    var gu = sigungu(name), bare = bareName(name);
    return gu ? gu + " " + bare : bare;
  }

  // 숲나들e 진입점.
  //
  // 예약 화면(fcfsRsrvtPssblGoodsDetls.do)으로 지점·날짜를 실어 직행하는 딥링크는
  // 쓸 수 없다. 숲나들e 가 Referer 를 검사해서, 자기 사이트 안에서 온 요청이
  // 아니면 404 를 준다(로그인 여부와 무관·날짜 유무와 무관). 외부 페이지인
  // 우리 달력에서는 어떤 방법으로도 통과할 수 없다 — rel="noreferrer" 로 Referer 를
  // 지워도 404 이고, 브라우저는 Referer 를 위조할 수 없다.
  //
  // 대신 휴양림 소개 페이지(selectFcltSrchView.do)로 보낸다. 지점 ID 하나만
  // 있으면 되고 Referer 를 가리지 않으며(로그인 여부도 무관), 그 안에 예약 버튼이
  // 있어 한 번 더 눌러 예약으로 넘어갈 수 있다.
  //
  // 지점 ID 를 모르는 경우(정책 표에만 있고 빈자리가 없어 달력에 안 실린 곳)만
  // 통합검색으로 폴백한다. 검색은 등록 표기가 제각각이라("덕적도 자연휴양림" 1건 /
  // 붙여 쓰면 0건, 반대로 띄우면 0건인 곳도 있다) 마지막 수단으로만 쓴다.
  var FCLT_BASE = "https://www.foresttrip.go.kr/pot/is/fs/selectFcltSrchView.do" +
    "?hmpgId=FRIP&menuId=002001&insttId=";
  var SEARCH_BASE = "https://www.foresttrip.go.kr/pot/is/gs/selectGnrlSrchView.do";

  function searchUrl(forestName) {
    return SEARCH_BASE + "?srchWord=" + encodeURIComponent(bareName(forestName));
  }

  function forestUrl(insttId, fallbackName) {
    return insttId ? FCLT_BASE + encodeURIComponent(insttId) : searchUrl(fallbackName);
  }

  // ── 지역 표기 ─────────────────────────────────────────────
  // 숲나들e 의 지역 값은 "서울/인천/경기", "대구경북" 처럼 여러 시·도가 묶여 있어
  // 그대로 쓰면 길고 어디인지도 흐릿하다. 묶음 안에서 시·군·구로 광역시/도를
  // 가려내 "서울 노원구", "경기 가평" 처럼 짧게 만든다.
  // 같은 "동구·서구"라도 묶음이 다르면 다른 지역이므로 묶음별로 목록을 나눠 둔다.
  var SEOUL_GU = ("종로구 중구 용산구 성동구 광진구 동대문구 중랑구 성북구 강북구 도봉구 " +
    "노원구 은평구 서대문구 마포구 양천구 강서구 구로구 금천구 영등포구 동작구 " +
    "관악구 서초구 강남구 송파구 강동구").split(" ");
  var INCHEON = "인천시 강화군 옹진군 영종구 미추홀구 연수구 남동구 부평구 계양구".split(" ");
  var DAEGU = "대구시 달성군 군위군 수성구 달서구".split(" ");
  var DAEJEON = "대전시 유성구 대덕구 동구 서구 중구".split(" ");
  var BUSAN = "부산시 기장군 해운대구 사하구 금정구 연제구 수영구 사상구 영도구".split(" ");
  var ULSAN = "울산시 울주군".split(" ");
  var GWANGJU = "광주시 광산구".split(" ");
  var SOLO = { "강원": "강원", "충북": "충북", "전북": "전북", "제주": "제주" };

  function wideArea(region, sigungu) {
    var r = String(region || "").replace(/[\/\s]/g, "");
    if (SOLO[r]) return SOLO[r];
    var s = String(sigungu || "");
    var has = function (list) { return list.indexOf(s) !== -1; };
    if (r === "서울인천경기") {
      return has(SEOUL_GU) ? "서울" : has(INCHEON) ? "인천" : "경기";
    }
    if (r === "대구경북") return has(DAEGU) ? "대구" : "경북";
    if (r === "대전충남") return has(DAEJEON) ? "대전" : "충남";
    if (r === "부산경남") return has(BUSAN) ? "부산" : has(ULSAN) ? "울산" : "경남";
    if (r === "전남광주") return has(GWANGJU) ? "광주" : "전남";
    return region || "";
  }

  // "용인시"→"용인", "가평군"→"가평", "청주시 상당구"→"청주 상당구",
  // "노원구"→"노원구"(자치구는 그대로), "대구시"→""(광역명과 겹쳐 생략)
  function compactSigungu(s) {
    if (!s) return "";
    if (/^(서울|인천|부산|대구|광주|대전|울산|세종)시?$/.test(s)) return "";
    return s.replace(/시\s+/, " ").replace(/(시|군)$/, "");
  }

  function areaLabel(region, sigungu) {
    var wide = wideArea(region, sigungu);
    var local = compactSigungu(sigungu);
    return local ? (wide ? wide + " " + local : local) : wide;
  }

  // 지점별 광역시/도. 필터가 표시와 같은 단위로 걸리도록 미리 계산해 둔다
  // (묶음 그대로 두면 "서울 노원구"를 보고도 서울만 골라낼 수 없다).
  var FOREST_WIDE = [];
  function buildAreaCache() {
    FOREST_WIDE = FORESTS.map(function (f) { return wideArea(f[2], sigungu(f[0])); });
  }

  var WIDE_ORDER = ("서울 인천 경기 강원 충북 충남 대전 세종 전북 전남 광주 " +
    "경북 대구 경남 부산 울산 제주").split(" ");

  // "[공립](가평군)강씨봉자연휴양림" → "강씨봉" (달력 셀 미리보기용 축약)
  function shortName(name) {
    return bareName(name).replace(/^국립\s*/, "").replace(/자연휴양림$/, "");
  }

  function openDetail(key) {
    var es = entriesFor(key);
    var y = key.slice(0, 4), m = parseInt(key.slice(4, 6), 10), d = parseInt(key.slice(6), 10);
    var opens = opensFor(d);
    if (!es.length && !opens.length) return;
    var dow = "일월화수목금토"[new Date(+y, m - 1, d).getDay()];
    $("dlg-title").textContent = y + "년 " + m + "월 " + d + "일 (" + dow + ") · 빈자리 " + es.length + "곳";

    var openHtml = "";
    if (opens.length) {
      // 정책 표에 공고된 정기 오픈일을 그대로 비춘 것이다. 그 표는 어느 달
      // 이용분인지, 선착순인지 추첨인지, 이번 회차가 이미 마감됐는지를 알려주지
      // 않는다(표의 선착순·추첨 칸도 실제와 어긋난다 — 추첨 칸에 적힌 강씨봉·
      // 석모도는 실제로는 선착순이고, 선착순 칸의 유명산은 추첨도 병행한다).
      // 그래서 단정하지 않고, 지점 페이지에서 확인하도록 안내만 덧붙인다.
      openHtml = '<div class="open-section"><h4>🔔 이날 정기 예약 오픈 (' + opens.length + "곳)</h4>" +
        opens.map(function (p) {
          var f = forestOfPolicy && forestOfPolicy.get(p);
          // 지점이 달력에 실려 있으면 그쪽 지역·시군구가 더 정확하고,
          // 없으면 정책 표의 값으로 대신한다
          var area = f
            ? areaLabel(f[2], sigungu(f[0]))
            : areaLabel(p.region, p.sigungu);
          var where = [p.type, area].filter(Boolean).join(" · ");
          // 지점 ID 를 알면 소개 페이지로 직행하고, 모르면 검색으로 폴백한다.
          // 폴백 검색어는 띄어쓰기가 살아 있는 정책 표 원문(label)을 쓴다
          // (name 은 공백을 지운 매칭 전용이라 검색이 0건으로 뜬다).
          var href = forestUrl(f && f[1], p.label || p.name);
          var lot = f && f[1] && LOTTERY[f[1]]
            ? '<em class="otag lot">추첨 병행</em>' : "";
          return '<div class="open-row">' +
            '<span class="ol"><a href="' + href + '" target="_blank" rel="noopener">' +
            esc(bareName(p.label || p.name)) + "</a>" +
            '<em class="otag">' + esc(where) + "</em>" + lot + "</span>" +
            "<span>" + esc(p.rule) + "</span></div>";
        }).join("") +
        '<p class="open-note">휴양림이 공고한 정기 오픈일입니다. 대부분 선착순 ' +
        '예약이 열리는 날이고, "추첨 병행"으로 표시된 곳은 추첨 신청일일 수 ' +
        '있습니다. 어느 달 이용분인지와 마감 여부는 각 휴양림 페이지에서 ' +
        '확인하세요.</p></div>';
    }

    $("dlg-body").innerHTML = openHtml + es.map(function (e) {
      var rooms = hydrateRooms(e.slots).map(function (r) {
        var meta = [];
        if (r.category) meta.push(r.category);
        if (r.capacity != null) meta.push("최대 " + r.capacity + "인");
        if (r.area != null) meta.push(r.area + "㎡");
        var price = r.price != null
          ? '<strong class="rp">' + r.price.toLocaleString("ko-KR") + "원</strong>"
          : '<span class="rp unknown">가격 미확인</span>';
        return '<div class="room"><span class="rn">' + esc(r.name) +
          '</span><span class="rm">' + esc(meta.join(" · ")) +
          (meta.length ? " · " : "") + price + "</span></div>";
      }).join("");
      var q = encodeURIComponent(mapQuery(e.name));
      var maps = '<span class="maps">' +
        '<a href="https://map.kakao.com/link/search/' + q + '" target="_blank" rel="noopener">카카오맵</a>' +
        '<a href="https://map.naver.com/p/search/' + q + '" target="_blank" rel="noopener">네이버지도</a>' +
        "</span>";
      var policy = policyFor(e.name);
      var ruleLine = policy && policy.rule
        ? '<div class="rule">예약 오픈: ' + esc(policy.rule) + "</div>"
        : "";
      var starred = !!favorites[e.id];
      var star = e.id
        ? '<button class="fav" type="button" data-fav="' + esc(e.id) + '"' +
          ' aria-pressed="' + (starred ? "true" : "false") + '"' +
          ' title="' + (starred ? "관심 해제" : "관심 휴양림으로 등록") + '">' +
          (starred ? "★" : "☆") + "</button>"
        : "";
      return '<div class="forest"><h3>' + star +
        '<a class="fname" href="' + forestUrl(e.id, e.name) + '" target="_blank" rel="noopener"' +
        ' title="숲나들e 휴양림 페이지 열기 (예약은 그 화면에서)">' + esc(e.name) + "</a>" +
        '<span class="region">' + esc(areaLabel(e.region, sigungu(e.name))) + "</span>" + maps + "</h3>" +
        ruleLine + rooms + "</div>";
    }).join("");
    // 스크롤을 되돌리지 않으면 앞서 본 날짜의 위치가 남아 새 내용이
    // 중간부터 보인다(오픈 섹션이 헤더 아래로 잘려 들어간다).
    $("dlg-body").scrollTop = 0;
    $("dlg").showModal();
  }

  function rerender() {
    $("reset").hidden = !(regionSel.length || typeSel.length || minPeople || maxPeople ||
      minPrice || maxPrice || filterText || favOnly);
    renderFilterMenus();
    renderFavToggle();
    renderTiles();
    renderTabs();
    renderGrid();
    saveState();
  }

  // ── 이벤트 ──────────────────────────────────────────────
  $("tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    current = parseInt(b.dataset.i, 10);
    renderTabs();
    renderGrid();
  });
  $("filter").addEventListener("input", function () {
    filterText = this.value.trim();
    rerender();
  });
  // 체크박스는 패널을 다시 그리면 포커스가 날아가므로, 선택 값만 읽어 반영하고
  // 요약 텍스트는 직접 갱신한다(패널은 열린 채로 여러 개를 고를 수 있어야 한다)
  function bindMulti(boxId, panelId, getSel, setSel, allLabel) {
    $(panelId).addEventListener("change", function () {
      setSel(Array.prototype.map.call(
        this.querySelectorAll("input:checked"), function (i) { return i.value; }
      ));
      var sel = getSel();
      var sum = $(boxId).querySelector("summary");
      if (!sel.length) { sum.textContent = allLabel; sum.classList.remove("on"); }
      else {
        sum.textContent = sel.length <= 2 ? sel.join("·") : sel[0] + " 외 " + (sel.length - 1);
        sum.classList.add("on");
      }
      $("reset").hidden = false;
      renderFavToggle();
      renderTiles();
      renderTabs();
      renderGrid();
      saveState();
    });
  }
  bindMulti("regionbox", "regionopts",
    function () { return regionSel; }, function (v) { regionSel = v; }, "전체 지역");
  bindMulti("typebox", "typeopts",
    function () { return typeSel; }, function (v) { typeSel = v; }, "전체 주체");

  // 패널 밖을 누르면 닫는다
  document.addEventListener("click", function (ev) {
    Array.prototype.forEach.call(document.querySelectorAll(".multi[open]"), function (d) {
      if (!d.contains(ev.target)) d.open = false;
    });
  });

  // 열릴 때 화면을 넘치면 오른쪽 기준으로 붙인다
  Array.prototype.forEach.call(document.querySelectorAll(".multi"), function (d) {
    d.addEventListener("toggle", function () {
      if (!d.open) return;
      var panel = d.querySelector(".multi-panel");
      panel.classList.remove("align-right");
      if (panel.getBoundingClientRect().right > window.innerWidth - 8) {
        panel.classList.add("align-right");
      }
    });
  });
  $("favonly").addEventListener("click", function () {
    favOnly = !favOnly;
    rerender();
  });
  // 상세 팝업의 ★ — 목록을 다시 그리지 않고 그 버튼만 바꿔 스크롤 위치를 지킨다
  $("dlg-body").addEventListener("click", function (ev) {
    var btn = ev.target.closest(".fav");
    if (!btn) return;
    var id = btn.dataset.fav;
    if (favorites[id]) delete favorites[id]; else favorites[id] = true;
    var on = !!favorites[id];
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.textContent = on ? "★" : "☆";
    btn.title = on ? "관심 해제" : "관심 휴양림으로 등록";
    renderFavToggle();
    renderTiles();
    renderGrid();
    saveState();
  });

  // 요금 입력은 만원 단위 — 사람이 쓰는 단위로 받고 내부에서는 원으로 다룬다
  function readPrices() {
    var lo = parseFloat($("pmin").value), hi = parseFloat($("pmax").value);
    minPrice = lo > 0 ? Math.round(lo * 10000) : 0;
    maxPrice = hi > 0 ? Math.round(hi * 10000) : 0;
    // 거꾸로 넣었으면 뒤집어 준다 (빈 결과를 보여주는 것보다 낫다)
    if (minPrice && maxPrice && minPrice > maxPrice) {
      var t = minPrice; minPrice = maxPrice; maxPrice = t;
    }
    rerender();
  }
  $("pmin").addEventListener("input", readPrices);
  $("pmax").addEventListener("input", readPrices);

  function readPeople() {
    var lo = parseInt($("cmin").value, 10), hi = parseInt($("cmax").value, 10);
    minPeople = lo > 0 ? lo : 0;
    maxPeople = hi > 0 ? hi : 0;
    if (minPeople && maxPeople && minPeople > maxPeople) {
      var t = minPeople; minPeople = maxPeople; maxPeople = t;
    }
    rerender();
  }
  $("cmin").addEventListener("input", readPeople);
  $("cmax").addEventListener("input", readPeople);

  $("reset").addEventListener("click", function () {
    $("cmin").value = ""; $("cmax").value = "";
    $("pmin").value = ""; $("pmax").value = ""; $("filter").value = "";
    regionSel = []; typeSel = [];
    minPeople = 0; maxPeople = 0; minPrice = 0; maxPrice = 0; filterText = "";
    favOnly = false;   // 관심 목록 자체는 남긴다 — 보기 조건만 되돌린다
    rerender();
  });

  // clipboard API 는 보안 컨텍스트에서만 쓸 수 있고 거부될 수도 있어
  // 구형 execCommand 로 한 번 더 시도한다(prompt 는 막는 브라우저가 있어 안 쓴다).
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) resolve(); else reject();
    });
  }

  // 현재 조건을 주소에 담아 복사한다 — 받는 쪽은 같은 화면으로 열린다
  $("share").addEventListener("click", function () {
    var q = stateToQuery();
    var url = location.origin + location.pathname + (q ? "?" + q : "");
    var btn = this, old = "🔗 링크 복사";
    var flash = function (msg) {
      btn.textContent = msg;
      setTimeout(function () { btn.textContent = old; }, 1800);
    };
    // 복사가 막히더라도 주소창은 같은 조건이 되므로 그걸 복사하면 된다
    history.replaceState(null, "", q ? "?" + q : location.pathname);
    copyText(url).then(function () { flash("✓ 복사됨"); },
      function () { flash("주소창을 복사하세요"); });
  });
  $("grid").addEventListener("click", function (ev) {
    var cell = ev.target.closest(".day.has");
    if (cell) openDetail(cell.dataset.key);
  });
  $("dlg-close").addEventListener("click", function () { $("dlg").close(); });
  $("dlg").addEventListener("click", function (ev) {
    if (ev.target === this) this.close();
  });

  // ── 데이터 로드 ─────────────────────────────────────────
  fetch("data/vacancy.json?v=" + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (json) {
      if (json.v !== 2) {
        throw new Error("데이터 형식(v" + (json.v || 1) + ")이 이 페이지와 맞지 않습니다");
      }
      DATA = json;
      FORESTS = DATA.forests || [];
      DIRECTORY = DATA.directory || [];
      LOTTERY = {};
      (DATA.lottery_ids || []).forEach(function (id) { LOTTERY[id] = true; });
      ROOMS = DATA.rooms || [];
      CATEGORIES = DATA.categories || [];
      var from = DATA.range.from, to = DATA.range.to;
      var seen = {};
      months = [];
      if (from && to) {
        var y = parseInt(from.slice(0, 4), 10), m = parseInt(from.slice(4, 6), 10);
        var endYm = to.slice(0, 6);
        for (var guard = 0; guard < 12; guard++) {
          var ym = "" + y + String(m).padStart(2, "0");
          if (!seen[ym]) { seen[ym] = 1; months.push(ym); }
          if (ym === endYm) break;
          m++; if (m > 12) { m = 1; y++; }
        }
      }
      if (!months.length) months = [todayKey().slice(0, 6)];
      var curYm = todayKey().slice(0, 6);
      current = Math.max(0, months.indexOf(curYm));
      buildPolicyIndex();
      buildForestLinks();   // policyFor 가 준비된 뒤에 역방향 맵을 만든다
      buildAreaCache();     // populateRegions 가 광역 목록을 쓰므로 그 앞에서
      populateRegions();
      populateTypes();
      // 주소에 조건이 실려 있으면 그쪽이 우선(공유 링크), 없으면 저장값을 복원
      if (!readQuery()) loadState();
      pruneSelections();
      applyStateToControls();
      rerender();
    })
    .catch(function (err) {
      $("meta").textContent = "데이터를 불러오지 못했습니다: " + err.message;
      // file:// 로 열면 브라우저가 같은 폴더의 JSON 조차 CORS 로 막는다.
      // 파일이 없는 것과 구분해서 안내한다.
      var isFile = location.protocol === "file:";
      $("grid").innerHTML = '<div class="empty-note">' + (isFile
        ? "브라우저가 <code>file://</code> 로 열린 페이지의 데이터 읽기를 막았습니다.<br>" +
          "로컬에서 볼 때는 간단한 서버로 띄워 주세요:<br><br>" +
          "<code>python3 -m http.server 8765 -d docs</code><br>" +
          "→ http://localhost:8765<br><br>" +
          "GitHub Pages 에 올린 뒤에는 그냥 주소만 열면 됩니다."
        : "data/vacancy.json 을 읽지 못했습니다. 배치(deploy.sh)가 한 번은 돌았는지 확인해 주세요."
      ) + "</div>";
    });
})();
</script>
</body>
</html>
